name: JobScout
options:
  bundleIdPrefix: ua.andrii
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  JobScout:
    type: application
    platform: macOS
    sources:
      - path: JobScout
      - path: Backend
        type: folder
        buildPhase: resources
      - path: Seed
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.andrii.JobScout
        PRODUCT_NAME: JobScout
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JobScout
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  JobScoutTests:
    type: bundle.unit-test
    platform: macOS
    sources: [JobScoutTests]
    dependencies:
      - target: JobScout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ua.andrii.JobScoutTests
        PRODUCT_NAME: JobScoutTests
        PRODUCT_MODULE_NAME: JobScoutTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JobScout.app/Contents/MacOS/JobScout"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  JobScout:
    build:
      targets:
        JobScout: all
    test:
      targets: [JobScoutTests]
