name: JobScout
options:
  bundleIdPrefix: ua.andrii
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TBBZBB993Z
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
packages:
  JobScoutKit:
    path: Packages/JobScoutKit
targets:
  JobScout:
    type: application
    platform: macOS
    sources:
      - path: JobScout
      - path: Backend
        type: folder
        buildPhase: resources
      - path: Seed
        type: folder
        buildPhase: resources
    dependencies:
      - package: JobScoutKit
    info:
      path: JobScout/Info.plist
      properties:
        CFBundleDisplayName: JobScout
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: JobScout connects to your vacancy service on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.andrii.JobScout
        PRODUCT_NAME: JobScout
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: JobScout
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  JobScoutTests:
    type: bundle.unit-test
    platform: macOS
    sources: [JobScoutTests]
    dependencies:
      - target: JobScout
      - package: JobScoutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ua.andrii.JobScoutTests
        PRODUCT_NAME: JobScoutTests
        PRODUCT_MODULE_NAME: JobScoutTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JobScout.app/Contents/MacOS/JobScout"
        BUNDLE_LOADER: "$(TEST_HOST)"
  JobScoutIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: JobScoutIOS
      - path: JobScout/Views/Components.swift
    dependencies:
      - package: JobScoutKit
    info:
      path: JobScoutIOS/Info.plist
      properties:
        CFBundleDisplayName: JobScout
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: JobScout connects to your Mac to read vacancies and control searches.
        NSBonjourServices: ["_jobscout._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.andrii.JobScout.ios
        PRODUCT_NAME: JobScoutIOS
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: ""
  JobScoutIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources: [JobScoutIOSTests]
    dependencies:
      - target: JobScoutIOS
      - package: JobScoutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ua.andrii.JobScout.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JobScoutIOS.app/JobScoutIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        MACOSX_DEPLOYMENT_TARGET: ""
schemes:
  JobScoutIOS:
    build:
      targets:
        JobScoutIOS: all
    test:
      targets: [JobScoutIOSTests]
  JobScout:
    build:
      targets:
        JobScout: all
    test:
      targets: [JobScoutTests]
